<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yaazhi Labs — Play Store header (4096×2304)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #F4F1EA;
    --paper-2: #EDE8DC;
    --ink: #0E0E10;
    --ink-2: #2B2B2E;
    --ink-3: #5C5C60;
    --line: #D9D3C2;
    --tang: #FF4D2E;
    --gold: #B8842E;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 4096px; height: 2304px; overflow: hidden; }
body {
    background: var(--paper);
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--ink);
    position: relative;
}

/* Subtle warm vignettes */
body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 1800px 1100px at 25% 35%, rgba(184, 132, 46, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 1500px 900px at 78% 70%, rgba(255, 77, 46, 0.05) 0%, transparent 65%);
    pointer-events: none;
}

.frame {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 280px;
    gap: 160px;
}

.logo-wrap {
    flex: 0 0 auto;
    width: 1500px;
    height: 1500px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 30px 50px rgba(184, 132, 46, 0.25));
}

.text-wrap {
    flex: 1;
    padding-top: 60px;
}

.eyebrow {
    font-family: 'Geist Mono', 'Geist', monospace;
    font-size: 42px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 80px;
}
.eyebrow .bar {
    width: 80px;
    height: 4px;
    background: var(--gold);
}

.headline {
    font-family: 'Bricolage Grotesque', 'Geist', sans-serif;
    font-weight: 500;
    font-size: 168px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 80px;
}
.headline .em {
    font-style: italic;
    font-weight: 600;
    color: var(--gold);
}

.subhead {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.45;
    color: var(--ink-3);
    max-width: 1700px;
}

/* Top + bottom rules */
.rule {
    position: absolute;
    left: 280px;
    right: 280px;
    height: 2px;
    background: var(--line);
}
.rule.top-rule { top: 280px; }
.rule.bottom-rule { bottom: 280px; }

/* Top-left and bottom-right meta */
.meta {
    position: absolute;
    font-family: 'Geist Mono', 'Geist', monospace;
    font-size: 36px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-3);
}
.meta.top-left {
    top: 180px;
    left: 280px;
    display: flex;
    align-items: center;
    gap: 28px;
}
.meta.top-left .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold);
}
.meta.bottom-right {
    bottom: 180px;
    right: 280px;
    text-align: right;
}
.meta.bottom-right .url {
    color: var(--ink);
    letter-spacing: 0.18em;
}
</style>
</head>
<body>

<div class="rule top-rule"></div>
<div class="rule bottom-rule"></div>

<div class="meta top-left"><span class="dot"></span><span>Yaazhi Labs · Studio</span></div>

<div class="frame">
    <div class="logo-wrap">
        <img src="YaazhiLabs.png" alt="Yaazhi Labs">
    </div>
    <div class="text-wrap">
        <div class="eyebrow"><span class="bar"></span><span>Yaazhi Labs · Studio</span></div>
        <div class="headline">Beautifully<br>crafted,<br><span class="em">collectible</span>.</div>
    </div>
</div>

<div class="meta bottom-right">
    <div class="url">yaazhilabs.com</div>
</div>

</body>
</html>
